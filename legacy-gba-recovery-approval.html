const STORE='mercury-recovered-gba-approval-github-v4',COLS=12,CELLW=88,CELLH=44,SCALE=2;
let E=[],D=JSON.parse(localStorage.getItem(STORE)||'{}'),F='unreviewed';
const $=q=>document.querySelector(q),G=$('#grid');
function csv(t){let R=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c=='"'&&n=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else{if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f.replace(/\r$/,''));R.push(r);r=[];f=''}else f+=c}}if(f||r.length){r.push(f);R.push(r)}let h=R.shift();return R.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}
function nice(s){return s.replaceAll('-',' ').replace(/\b\w/g,m=>m.toUpperCase()).replace('Bluetowel','BlueTowel').replace('Bt ','BT ')}
function S(id){return D[id]||{status:'',note:''}}function save(){localStorage.setItem(STORE,JSON.stringify(D))}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pass(e){let s=S(e.identity).status,q=$('#q').value.toLowerCase().trim();if(F==='unreviewed'&&s)return false;if(!['all','unreviewed'].includes(F)&&s!==F)return false;if(q&&!e.identity.toLowerCase().includes(q)&&!nice(e.identity).toLowerCase().includes(q))return false;return true}
function card(e){let d=S(e.identity),i=e.index,x=(i%COLS)*CELLW*SCALE,y=Math.floor(i/COLS)*CELLH*SCALE,full=Number(e.source_views)===4;
return '<div class="card"><div class="head"><div class="name">'+esc(nice(e.identity))+'</div><div class="id">'+esc(e.identity)+' • Dex #'+e.dex+' • Form '+e.form+'</div><span class="badge '+(full?'':'partial')+'">'+(full?'4/4 incl. shiny':'2/4 normal only')+'</span></div><div class="spriteWrap"><div class="sprite"><img src="'+ATLAS+'" style="left:-'+x+'px;top:-'+y+'px"></div></div><div class="labels"><span>Front</span><span>Back</span></div><div class="actions"><button class="approve '+(d.status==='approve'?'active':'')+'" data-id="'+e.identity+'" data-s="approve">Approve</button><button class="maybe '+(d.status==='maybe'?'active':'')+'" data-id="'+e.identity+'" data-s="maybe">Maybe</button><button class="reject '+(d.status==='reject'?'active':'')+'" data-id="'+e.identity+'" data-s="reject">Reject</button></div><div class="notes"><textarea data-note="'+e.identity+'" placeholder="Optional note / type / family idea">'+esc(d.note)+'</textarea></div></div>'}
function render(){let r=E.filter(pass),rev=E.filter(e=>S(e.identity).status).length;$('#count').textContent=r.length+' shown • '+rev+'/94 reviewed';G.innerHTML=r.map(card).join('');G.querySelectorAll('button[data-s]').forEach(b=>b.onclick=()=>{let d=S(b.dataset.id),s=b.dataset.s;D[b.dataset.id]={...d,status:d.status===s?'':s};save();render()});G.querySelectorAll('textarea[data-note]').forEach(t=>t.onchange=()=>{D[t.dataset.note]={...S(t.dataset.note),note:t.value};save()})}
document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('active'));b.classList.add('active');F=b.dataset.f;render()});$('#q').oninput=render;
$('#export').onclick=()=>{let c=['identity','dex','form','source_views','decision','note'],o=[c.join(',')];for(let e of E){let d=S(e.identity),r={identity:e.identity,dex:e.dex,form:e.form,source_views:e.source_views,decision:d.status,note:d.note};o.push(c.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.join('\n')],{type:'text/csv'}));a.download='mercury_recovered_gba_sprite_decisions.csv';a.click()};
fetch('DS_CUSTOM_LIBRARY/DS_READY_MASTER/reborn_plates_legacy_exact_map.csv?v=1').then(r=>r.text()).then(t=>{E=csv(t).map((r,i)=>({...r,index:i}));render()});
