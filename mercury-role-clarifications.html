<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mercury Role Clarifications</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:#fffefcf5;border-bottom:1px solid #d8e0eb;padding:9px}.w{max-width:900px;margin:auto}h1{font-size:18px;margin:0 0 4px}.sub,.sum{font-size:12px;color:#69758a;line-height:1.35}.ctrl{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}input,button,textarea{font:inherit;border:1px solid #cbd6e5;border-radius:9px;background:#fff;color:#172033}input{height:38px;padding:0 9px}button{padding:8px 9px;font-weight:750}.export{background:#244a78;color:#fff}.p{height:5px;background:#e4eaf2;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:#4d78ad}main{max-width:900px;margin:10px auto;padding:0 9px 50px}.sum{margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px}.card{background:#fff;border:1px solid #d8e0eb;border-radius:12px;overflow:hidden}.hd{padding:8px 9px;border-bottom:1px solid #edf1f6}.nm{font-size:16px;font-weight:850}.id{font-size:10px;color:#69758a}.art{height:140px;display:flex;align-items:center;justify-content:center;background:#f8fafc}.art img{max-width:95%;max-height:132px;image-rendering:pixelated}.info{padding:8px 9px;font-size:12px}.type{font-weight:800;color:#244a78}.fam{margin-top:4px}.note{margin-top:6px;background:#fff8dc;border-radius:7px;padding:6px;color:#6d5a18}.choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:8px 9px;border-top:1px solid #edf1f6}.choices button{font-size:11px;padding:9px 3px}.e.active{background:#dff2df}.m.active{background:#fff0bf}.d.active{background:#ebe2ff}.edit{padding:0 9px 9px}.edit textarea{width:100%;min-height:42px;padding:6px}.issueHead{margin:16px 0 8px;font-size:16px;font-weight:850}.issue{background:#fff;border:1px solid #d8e0eb;border-radius:12px;padding:10px;margin-bottom:9px}.issueTitle{font-weight:850;font-size:15px}.issueWhy{font-size:12px;color:#526176;line-height:1.4;margin-top:4px}.issueMembers{font-size:12px;margin-top:6px;padding:7px;background:#f8fafc;border-radius:8px}.issueChoices{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.issueChoices button.active{background:#dff2df}.hide{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="w"><h1>Mercury — Clarifications Only</h1><div class="sub">Your completed placement review is preserved. These are only the entries that were still saved as “Existing species replacement.” Vanilla Pokémon will stay unchanged; choose Evolution, Mega, or Delta.</div><div class="ctrl"><input id="q" placeholder="Search Pokémon"><button id="export" class="export">Export</button></div><div class="p"><div id="bar" class="bar"></div></div></div></header><main><div id="sum" class="sum">Loading…</div><div id="grid" class="grid"></div><div class="issueHead">Family groupings that still need clarification</div><div id="issues"></div></main><script>
const IDS=["platinum-redux-venusaur","platinum-redux-charizard","platinum-redux-butterfree","platinum-redux-arbok","platinum-redux-clefable","platinum-redux-venomoth","platinum-redux-victreebel","platinum-redux-electrode","platinum-redux-weezing","platinum-redux-gyarados","platinum-redux-lapras","platinum-redux-vaporeon","platinum-redux-jolteon","platinum-redux-flareon","platinum-redux-snorlax","platinum-redux-dragonite","platinum-redux-feraligatr","platinum-redux-noctowl","platinum-redux-ampharos","platinum-redux-bellossom","platinum-redux-azumarill","platinum-redux-sudowoodo","platinum-redux-politoed","platinum-redux-sunflora","platinum-redux-espeon","platinum-redux-umbreon","platinum-redux-shuckle","platinum-redux-donphan","platinum-redux-miltank","platinum-redux-raikou","platinum-redux-lugia","platinum-redux-celebi","platinum-redux-eelektross","platinum-redux-mawile","platinum-redux-swalot","platinum-redux-torkoal","platinum-redux-flygon","platinum-redux-lunatone","platinum-redux-milotic","platinum-redux-tropius","platinum-redux-absol","platinum-redux-glalie","platinum-redux-salamence","platinum-redux-regirock","platinum-redux-regice","platinum-redux-registeel","platinum-redux-kyogre","platinum-redux-luxray","platinum-redux-bastiodon","platinum-redux-aurorus","platinum-redux-mismagius","platinum-redux-cofagrigus","platinum-redux-beartic","platinum-redux-electivire","platinum-redux-leafeon","platinum-redux-glaceon","platinum-redux-probopass","platinum-redux-dusknoir","platinum-redux-diancie"],RAW='https://raw.githubusercontent.com/lionsprideemb-tech/Sprites/main/',SRC=RAW+'DS_CUSTOM_LIBRARY/DS_READY_MASTER/platinum_redux_review_entries.json?v=clarify1',STORE='mercury-role-clarifications-v1';
const FAMILY_ISSUES=[
{id:'alakazam-delta',title:'Abra / Kadabra / Alakazam',members:'Platinum Redux Alakazam',why:'You wrote “stand alone delta I guess.” We still need to decide whether this is only a Delta Alakazam or whether Abra/Kadabra also need matching Delta stages.',choices:['Standalone Delta Alakazam','Full Delta family','Needs another design']},
{id:'altaria-megay',title:'Swablu / Altaria',members:'Platinum Redux Altaria + existing Altaria/Mega art',why:'You marked this “Mega Y.” Confirm whether it is specifically Mega Altaria Y and whether the other approved Mega remains Mega Altaria X/default.',choices:['Mega Altaria Y','Replace other Mega slot','Needs comparison']},
{id:'beartic-polartic',title:'Cubchoo / Beartic / Polartic',members:'Platinum Redux Beartic + Polartic evolution',why:'You flagged the conflict yourself: Polartic already occupies the evolution slot, so this design needs a different role.',choices:['Mega Beartic','Branch evolution','Delta Beartic']},
{id:'patrat-split',title:'Patrat / Watchog extensions',members:'Glanchog + Seerkat',why:'Both entries are marked “Split evolution.” We need the exact branch structure so one does not accidentally overwrite the other.',choices:['Both branch from Watchog','One from Patrat / one from Watchog','Needs redesign']},
{id:'impurp-nymfusha',title:'Impurp / Nymfusha',members:'Impurp + Nymfusha',why:'Impurp was grouped with Nymfusha but your note says “No evolution.” Confirm whether they should be separated into standalone species/families.',choices:['Separate them','Keep evolution','Needs more info']},
{id:'vulpix-alt',title:'Vulpix alternate line',members:'Vulpix Alternate Form 2',why:'You approved the Vulpix design but wrote “No Ninetales.” We need to know whether it stays a one-stage Delta/form or eventually gets a different evolution.',choices:['Standalone Vulpix form','Give it a new evolution','Needs Ninetales design']},
{id:'ampharos-mega',title:'Mareep / Flaaffy / Ampharos',members:'Ampharos Alternate Mega Form 3',why:'You marked this “Mega maybe.” Confirm whether it should actually occupy a Mega Ampharos slot or become a Delta/evolution concept instead.',choices:['Mega Ampharos','Delta Ampharos','New evolution']}
];
let rows=[],D={},FD={};try{D=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{}try{FD=JSON.parse(localStorage.getItem(STORE+'-families')||'{}')}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(STORE,JSON.stringify(D));stats()}
function stats(){let n=rows.filter(r=>D[r.identity]?.role).length;sum.textContent=n+' / '+rows.length+' clarified — nothing else needs to be redone.';bar.style.width=(rows.length?n/rows.length*100:0)+'%'}
function render(){let qq=q.value.trim().toLowerCase();grid.innerHTML=rows.map(r=>{let d=D[r.identity]||{},hide=qq&&!((r.identity+' '+(r.name||'')+' '+(r.family||'')).toLowerCase().includes(qq)),note=r.identity==='platinum-redux-beartic'?'You previously noted that Polartic already occupies an evolution slot, so this one may make more sense as a Mega.':'';return '<article class="card '+(hide?'hide':'')+'" data-id="'+esc(r.identity)+'"><div class="hd"><div class="nm">'+esc(r.name||r.identity)+'</div><div class="id">'+esc(r.identity)+'</div></div><div class="art"><img loading="lazy" src="'+RAW+encodeURI(r.front_path)+'"></div><div class="info"><div class="type">'+esc([r.type1,r.type2].filter(Boolean).join(' / '))+'</div><div class="fam"><b>Family:</b> '+esc(r.family||r.name)+'</div>'+(note?'<div class="note">'+esc(note)+'</div>':'')+'</div><div class="choices"><button class="e '+(d.role==='Evolution of existing species'?'active':'')+'" data-role="Evolution of existing species">Evolution</button><button class="m '+(d.role==='Mega evolution'?'active':'')+'" data-role="Mega evolution">Mega</button><button class="d '+(d.role==='Delta/Redux existing family'?'active':'')+'" data-role="Delta/Redux existing family">Delta</button></div><div class="edit"><textarea placeholder="Optional note / evolution name / Mega X-Y-Z / Delta detail">'+esc(d.note||'')+'</textarea></div></article>'}).join('');grid.querySelectorAll('.card').forEach(c=>{let id=c.dataset.id;c.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{D[id]={...(D[id]||{}),role:b.dataset.role};save();render()});c.querySelector('textarea').onchange=e=>{D[id]={...(D[id]||{}),note:e.target.value};save()}});stats()}
function renderIssues(){issues.innerHTML=FAMILY_ISSUES.map(x=>{let d=FD[x.id]||{};return '<div class="issue"><div class="issueTitle">'+esc(x.title)+'</div><div class="issueWhy">'+esc(x.why)+'</div><div class="issueMembers"><b>Approved members involved:</b> '+esc(x.members)+'</div><div class="issueChoices">'+x.choices.map(c=>'<button data-i="'+esc(x.id)+'" data-c="'+esc(c)+'" class="'+(d.choice===c?'active':'')+'">'+esc(c)+'</button>').join('')+'</div></div>'}).join('');issues.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{FD[b.dataset.i]={choice:b.dataset.c};localStorage.setItem(STORE+'-families',JSON.stringify(FD));renderIssues()})}
renderIssues();
q.oninput=render;export.onclick=()=>{let out=[['identity','clarified_role','clarification_note']];rows.forEach(r=>{let d=D[r.identity]||{};out.push([r.identity,d.role||'',d.note||''])});FAMILY_ISSUES.forEach(x=>{let d=FD[x.id]||{};out.push(['FAMILY:'+x.id,d.choice||'',''])});let csv=out.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mercury_role_clarifications.csv';a.click()};
fetch(SRC,{cache:'no-store'}).then(r=>r.json()).then(j=>{let m=new Map((j.entries||[]).map(x=>[x.identity,x]));rows=IDS.map(id=>m.get(id)).filter(Boolean);render()}).catch(e=>sum.textContent='Could not load clarification data: '+e.message);
</script></body></html>
