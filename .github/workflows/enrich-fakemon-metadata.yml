name: Enrich Fakemon Approval Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/enrich_fakemon_metadata.py'
      - 'DS_CUSTOM_LIBRARY/.run-fakemon-enrichment'
      - 'DS_CUSTOM_LIBRARY/DS_READY_MASTER/ds_ready_front_design_manifest.csv'

permissions:
  contents: write

concurrency:
  group: mercury-fakemon-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enrich Fakemon metadata
        run: python tools/enrich_fakemon_metadata.py
      - name: Commit enrichment from latest main
        run: |
          git config user.name "Mercury Fakemon Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          # Regenerate on the latest main so stale concurrent output commits can
          # never create a rebase conflict.
          git fetch origin main
          git reset --hard origin/main
          python tools/enrich_fakemon_metadata.py
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enrich Fakemon names types families and back-sprite links"
          git pull --rebase origin main
          git push origin main
