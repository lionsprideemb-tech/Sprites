name: Recover External Fakemon Metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/recover_external_fakemon_metadata.py'
permissions:
  contents: write
concurrency:
  group: mercury-external-fakemon-metadata
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recover source metadata
        run: python tools/recover_external_fakemon_metadata.py
      - name: Commit metadata
        run: |
          git config user.name "Mercury Metadata Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER/external_fakemon_metadata.json
          git commit -m "Recover external Fakemon metadata" || exit 0
          git pull --rebase origin main
          git push origin main
