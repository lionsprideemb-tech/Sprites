name: Verify Final Fakemon Approval Pool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/verify_final_fakemon_pool.py'
      - 'DS_CUSTOM_LIBRARY/.run-final-fakemon-verification'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approval-ready Fakemon
        run: python tools/verify_final_fakemon_pool.py
      - name: Commit verification report
        run: |
          git config user.name "Mercury Fakemon Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify final Fakemon approval pool"
          git pull --rebase origin main
          git push origin main
