name: Orpheus DS64 detailed indexed pixel diagnostics (research only)
on:
  push:
    branches:
      - mercury/orpheus-resource-audit-20261109
    paths:
      - tools/orpheus_ds64_depth_map.py
      - .github/workflows/orpheus-ds64-depth-qa.yml
      - tools/orpheus_ds64_depth_cleanup.py
      - review/candidates/orpheus-2026-11-09-UNAPPROVED/microfix-real-pixels/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pixel-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Generate exact index grids for eye/wing/antenna inspection
        run: python tools/orpheus_ds64_depth_map.py
      - name: Upload research-only indexed pixel maps
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-ds64-depth-index-grids-unapproved
          path: report/orpheus-depth/
          retention-days: 14
