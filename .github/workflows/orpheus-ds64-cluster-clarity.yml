name: Orpheus native DS64 feature-preserving cluster cleanup (unapproved)
on:
  push:
    branches: [mercury/orpheus-resource-audit-20261109]
    paths:
      - tools/orpheus_ds64_cluster_clarity.py
      - .github/workflows/orpheus-ds64-cluster-clarity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cluster-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Source-tile 64px color island reduction and exact DS4bpp QA
        run: python tools/orpheus_ds64_cluster_clarity.py
      - name: Save research-only verified art variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-ds64-low-noise-art-unapproved
          path: report/cluster_clarity/
          retention-days: 30
