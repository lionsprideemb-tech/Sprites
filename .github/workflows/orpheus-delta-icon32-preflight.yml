name: Delta Desert Scarab source icon32 conversion study (UNAPPROVED)
on:
  push:
    branches: [mercury/orpheus-resource-audit-20261109]
    paths:
      - tools/orpheus_delta_icon32_preflight.py
      - .github/workflows/orpheus-delta-icon32-preflight.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indexed-icon-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Analyze 2x source block loss and generate three true indexed 32px icon candidates
        run: |
          set -euo pipefail
          python3 tools/orpheus_delta_icon32_preflight.py
          test -s report/orpheus_delta_icon32/icon32_qa.json
      - name: Publish only unapproved source-locked icon candidate outputs
        run: |
          set -euo pipefail
          dest=review/candidates/orpheus-2026-11-09-UNAPPROVED/delta-icon32-candidates
          mkdir -p "$dest"
          cp -a report/orpheus_delta_icon32/. "$dest/"
          git config user.name "mercury-sprite-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Publish three source-audited Desert Scarab 32px icon candidates, no approval"
            git push origin HEAD:mercury/orpheus-resource-audit-20261109
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-delta-icon32-unapproved
          path: report/orpheus_delta_icon32/
          retention-days: 30
