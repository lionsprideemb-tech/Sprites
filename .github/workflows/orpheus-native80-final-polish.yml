name: Orpheus native80 final pixel polish (isolated unapproved)
on:
  push:
    branches: [mercury/orpheus-resource-audit-20261109]
    paths:
      - tools/orpheus_native80_face_grid_inspect.py
      - tools/orpheus_native80_final_pixel_polish.py
      - .github/workflows/orpheus-native80-final-polish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pixel-inspect-and-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controlled image decoder
        run: python -m pip install pillow==11.3.0
      - name: Decode baseline pixel grid and verify byte-exact palette
        run: python tools/orpheus_native80_face_grid_inspect.py
      - name: Apply native80 surgical pixel edits when polish script exists
        run: |
          if test -f tools/orpheus_native80_final_pixel_polish.py; then
            python tools/orpheus_native80_final_pixel_polish.py
          fi
      - name: Publish exact review-only evidence on the isolated branch
        run: |
          set -euo pipefail
          target=review/candidates/orpheus-2026-11-09-UNAPPROVED
          mkdir -p "$target/native80-face-grid" "$target/native80-final-pixel-polish"
          cp -a report/orpheus_native80_face_grid/. "$target/native80-face-grid/"
          if test -d report/orpheus_native80_final_polish; then
            cp -a report/orpheus_native80_final_polish/. "$target/native80-final-pixel-polish/"
          fi
          git config user.name "mercury-sprite-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target/native80-face-grid" "$target/native80-final-pixel-polish"
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified DS80 original-color Flygon face inspection/polish, no approvals"
            git push origin HEAD:mercury/orpheus-resource-audit-20261109
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-native80-final-pixel-QA-unapproved
          path: |
            report/orpheus_native80_face_grid
            report/orpheus_native80_final_polish
          retention-days: 30
