name: Audit Final 262 Recolors

on:
  workflow_dispatch:
  push:
    paths:
      - "mercury-final-polished-sprite-approval.html"
      - ".github/workflows/audit-final-262-recolors.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: pip install pillow

      - name: Compare polished candidates against vanilla DS art
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, json, re

          page=Path("mercury-final-polished-sprite-approval.html").read_text()
          core=Path("DS_CUSTOM_LIBRARY/packs/DrPrettyman_DS_64x64/sprites-processed/front")

          def norm(s):
              s=s.lower().replace("_","-").replace(" ","-").replace("'","")
              s=re.sub(r"[^a-z0-9-]+","-",s)
              return re.sub(r"-+","-",s).strip("-")

          vanilla={}
          if core.exists():
              for p in core.iterdir():
                  if p.is_file() and p.suffix.lower() in {".png",".gif",".bmp",".webp",".jpg",".jpeg"}:
                      vanilla[norm(p.stem)]=p

          def trimmed(im):
              im=im.convert("RGBA")
              bbox=im.getchannel("A").getbbox()
              return im.crop(bbox) if bbox else im

          def sig(im):
              im=trimmed(im)
              cmap={}; nxt=1; out=bytearray()
              out.extend(im.width.to_bytes(2,"big")); out.extend(im.height.to_bytes(2,"big"))
              for r,g,b,a in im.getdata():
                  if a==0:
                      out.extend((0,0)); continue
                  k=(r,g,b,a)
                  if k not in cmap:
                      cmap[k]=nxt; nxt+=1
                  out.extend(cmap[k].to_bytes(2,"big"))
              return hashlib.sha256(out).hexdigest()

          card_re=re.compile(
              r'<article class="card" data-id="([^"]+)" data-species="([^"]+)"[^>]*>.*?'
              r'<div class="sprites" data-front="data:image/png;base64,([^"]*)"',
              re.S
          )

          result={}
          for ident,species,b64 in card_re.findall(page):
              item={"species":species,"pure_recolor":False,"vanilla_found":False,"reason":""}
              key=norm(species)
              vp=vanilla.get(key)
              if not vp:
                  # accept a concrete non-Mega form if a bare species filename is absent
                  opts=[p for k,p in vanilla.items() if k.startswith(key+"-") and "mega" not in k and "gmax" not in k]
                  vp=opts[0] if opts else None
              if not vp:
                  item["reason"]="No canonical vanilla front sprite found for direct recolor comparison."
                  result[ident]=item
                  continue
              item["vanilla_found"]=True
              try:
                  cand=Image.open(io.BytesIO(base64.b64decode(b64))).convert("RGBA")
                  van=Image.open(vp).convert("RGBA")
                  item["pure_recolor"]=(sig(cand)==sig(van))
                  item["reason"]="Same pixel structure as vanilla; palette differs only." if item["pure_recolor"] else "Pixel structure differs from vanilla; this is an actual design change."
              except Exception as e:
                  item["reason"]=f"Comparison error: {type(e).__name__}"
              result[ident]=item

          Path("final-262-recolor-audit.json").write_text(json.dumps(result,indent=2)+"\n")
          summary={
              "entries":len(result),
              "vanilla_found":sum(x["vanilla_found"] for x in result.values()),
              "pure_recolors":sum(x["pure_recolor"] for x in result.values()),
              "design_changes":sum(x["vanilla_found"] and not x["pure_recolor"] for x in result.values()),
              "unmatched_vanilla":sum(not x["vanilla_found"] for x in result.values())
          }
          Path("final-262-recolor-audit-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))

      - name: Commit audit
        run: |
          git config user.name "Mercury Sprite Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add final-262-recolor-audit.json final-262-recolor-audit-summary.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Audit final 262 candidates for pure vanilla recolors"
          git pull --rebase origin main
          git push origin main
