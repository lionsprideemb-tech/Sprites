name: Audit Final 262 Recolors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mercury-final-polished-sprite-approval.html'
      - '.github/workflows/audit-final-262-recolors.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Compare candidate silhouettes to vanilla DS sprites
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, html, io, json, re

          PAGE=Path('mercury-final-polished-sprite-approval.html')
          VANILLA=Path('DS_CUSTOM_LIBRARY/packs/DrPrettyman_DS_64x64/sprites-processed/front')
          OUT=Path('final-262-recolor-audit.json')

          def norm(s):
              s=html.unescape(str(s)).lower().replace('_','-').replace(' ','-').replace("'",'')
              s=re.sub(r'[^a-z0-9-]+','-',s)
              return re.sub(r'-+','-',s).strip('-')

          def structural_signature(im):
              im=im.convert('RGBA')
              cmap={}
              nxt=1
              out=bytearray()
              out.extend(im.width.to_bytes(2,'big'))
              out.extend(im.height.to_bytes(2,'big'))
              for r,g,b,a in im.getdata():
                  if a==0:
                      out.extend((0,0))
                      continue
                  k=(r,g,b,a)
                  if k not in cmap:
                      cmap[k]=nxt
                      nxt+=1
                  out.extend(cmap[k].to_bytes(2,'big'))
              return hashlib.sha256(out).hexdigest()

          vanilla={}
          for p in VANILLA.glob('*'):
              if not p.is_file():
                  continue
              try:
                  with Image.open(p) as im:
                      sig=structural_signature(im)
                  vanilla.setdefault(norm(p.stem),[]).append((p.as_posix(),sig))
              except Exception:
                  pass

          text=PAGE.read_text(errors='ignore')
          cards=re.findall(r'(<article class="card"[^>]*data-id="[^"]+"[^>]*>.*?</article>)',text,re.S)
          result={}
          pure=0
          for card in cards:
              mid=re.search(r'data-id="([^"]+)"',card)
              msp=re.search(r'data-species="([^"]+)"',card)
              mfront=re.search(r'data-front="data:image/png;base64,([^"]+)"',card)
              if not (mid and msp and mfront):
                  continue
              ident=html.unescape(mid.group(1))
              species=html.unescape(msp.group(1))
              try:
                  data=base64.b64decode(mfront.group(1))
                  cand_sig=structural_signature(Image.open(io.BytesIO(data)))
              except Exception:
                  result[ident]={"species":species,"pure_recolor":False,"status":"candidate_decode_failed"}
                  continue
              key=norm(species)
              matches=vanilla.get(key,[])
              is_recolor=any(sig==cand_sig for _,sig in matches)
              if is_recolor:
                  pure+=1
              result[ident]={
                  "species":species,
                  "pure_recolor":is_recolor,
                  "status":"matched_vanilla_palette_only" if is_recolor else ("actual_design_change" if matches else "vanilla_reference_missing"),
                  "vanilla_reference":matches[0][0] if matches else ""
              }

          OUT.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              "cards_scanned":len(cards),
              "audited":len(result),
              "pure_recolors":pure,
              "actual_or_unmatched":len(result)-pure
          },indent=2))

      - name: Commit audit
        run: |
          git config user.name "Mercury Sprite Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add final-262-recolor-audit.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Audit final 262 candidates against vanilla recolors"
          git pull --rebase origin main
          git push origin main
