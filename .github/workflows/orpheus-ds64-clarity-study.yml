name: Orpheus DS64 focused visual clarity study (UNAPPROVED)
on:
  push:
    branches:
      - mercury/orpheus-resource-audit-20261109
    paths:
      - tools/orpheus_ds64_clarity_study.py
      - .github/workflows/orpheus-ds64-clarity-study.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Render 2 source-indexed DS64 clarity alternatives with full tile and alpha verification
        run: python tools/orpheus_ds64_clarity_study.py
      - name: Save source-authentic unapproved comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-DS64-clarity-source-guided-unapproved
          path: report/clarity_pass/
          retention-days: 30
