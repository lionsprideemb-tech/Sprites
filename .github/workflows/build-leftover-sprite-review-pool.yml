name: Build Leftover Sprite Review Pool

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercury-leftover-sprite-pool
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build leftovers-only review pool
        run: python tools/build_leftover_review_pool.py
      - name: Commit pool
        run: |
          git config user.name "Mercury Leftover Sprite Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER/leftover_review_pool.csv DS_CUSTOM_LIBRARY/DS_READY_MASTER/leftover_review_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build leftover sprite review pool"
          git pull --rebase origin main
          git push origin main
