name: Map Platinum Redux Workbook Sprites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/map_platinum_redux_workbook.py'
      - 'DS_CUSTOM_LIBRARY/.run-platinum-redux-map'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install gdown openpyxl pillow
      - name: Map workbook sprites
        run: python tools/map_platinum_redux_workbook.py
      - name: Commit mapping
        run: |
          git config user.name "Mercury Platinum Mapper"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Map Platinum Redux embedded sprites to workbook rows"
          git pull --rebase origin main
          git push origin main
