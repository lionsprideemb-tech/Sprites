name: Orpheus Desert Scarab DS80 final vein and scute contrast (UNAPPROVED)
on:
  push:
    branches: [mercury/orpheus-resource-audit-20261109]
    paths:
      - tools/orpheus_desert_scarab_vein_scute_polish.py
      - .github/workflows/orpheus-desert-scarab-vein-scute-polish.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-native80-pixel-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow image decoder
        run: python -m pip install pillow==11.3.0
      - name: Apply exact indexed 4bpp wing-vein/scute refinement, verify and render
        run: |
          set -euo pipefail
          python tools/orpheus_desert_scarab_vein_scute_polish.py
          test -s report/desert_scarab_vein_scute_polish/veins_scutes_exact_QA.json
          test -s report/desert_scarab_vein_scute_polish/desert_scarab_veins_scutes_before_after_mobile.png
      - name: Publish candidate only on isolated branch; never approvals or ROM
        run: |
          set -euo pipefail
          dest=review/candidates/orpheus-2026-11-09-UNAPPROVED/desert-scarab-vein-scute-polish-native80
          mkdir -p "$dest"
          cp -a report/desert_scarab_vein_scute_polish/. "$dest/"
          git config user.name "mercury-sprite-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Publish unapproved authentic DS80 Desert Scarab four-view vein/scute contrast and QA"
            git push origin HEAD:mercury/orpheus-resource-audit-20261109
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mercury-desert-scarab-native80-wing-scale-unapproved
          path: report/desert_scarab_vein_scute_polish/
          retention-days: 30
