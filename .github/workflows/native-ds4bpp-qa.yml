name: Mercury native DS4bpp sprite QA (no ROM integration)
on:
  push:
    branches:
      - mercury/native-ds4bpp-qa-20261109
    paths:
      - "tools/stage_native_ds4bpp_qa.py"
      - ".github/workflows/native-ds4bpp-qa.yml"
  pull_request:
    paths:
      - "tools/stage_native_ds4bpp_qa.py"
      - ".github/workflows/native-ds4bpp-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out original artwork and protected votes
        uses: actions/checkout@v4
      - name: Install Pillow for color-verified sprite decoding
        run: python3 -m pip install --quiet pillow
      - name: Verify 4bpp nibble order, palette and transparency on synthetic boundary samples
        run: python3 tools/stage_native_ds4bpp_qa.py --self-test
      - name: Verify original creative decisions are unchanged
        run: |
          node review/tests/final-user-artwork-approvals.cjs
          node review/tests/master-review-integrity.cjs
      - name: Reverify all source-faithful DS64 technical previews and original source hashes
        run: python3 tools/convert_verified_source_pairs_ds64.py --check
      - name: Encode exact-source-approved original-color DS64 views to native 4bpp QA tiles and BGR555 palettes
        run: python3 tools/stage_native_ds4bpp_qa.py --out "$RUNNER_TEMP/native-ds4bpp-qa"
      - name: Decode every tile to pixels and verify regenerated tiles, palettes, decoded previews and SHA-256 reports
        run: python3 tools/stage_native_ds4bpp_qa.py --out "$RUNNER_TEMP/native-ds4bpp-qa" --verify
      - name: Publish standalone QA package, never a ROM or integrated species asset
        uses: actions/upload-artifact@v4
        with:
          name: mercury-native-ds4bpp-qa-not-rom
          path: ${{ runner.temp }}/native-ds4bpp-qa/
          if-no-files-found: error
          retention-days: 30
