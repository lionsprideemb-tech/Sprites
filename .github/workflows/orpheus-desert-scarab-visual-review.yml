name: Orpheus Desert Scarab native80 visual review (read-only sprites)
on:
  push:
    branches:
      - mercury/orpheus-resource-audit-20261109
    paths:
      - tools/orpheus_desert_scarab_visual_review.py
      - .github/workflows/orpheus-desert-scarab-visual-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Verify exact native80 tiles and render 4x nearest-neighbor review
        run: python tools/orpheus_desert_scarab_visual_review.py
      - name: Publish only read-only comparison and QA
        run: |
          set -euo pipefail
          target=review/candidates/orpheus-2026-11-09-UNAPPROVED/desert-scarab-mobile-visual-review
          mkdir -p "$target"
          cp -a report/desert_scarab_visual_review/. "$target/"
          git config user.name "mercury-sprite-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-verified native80 and 4x mobile Desert Scarab visual comparison, unapproved"
            git push origin HEAD:mercury/orpheus-resource-audit-20261109
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orpheus-desert-scarab-native80-mobile-review
          path: report/desert_scarab_visual_review
          retention-days: 30
