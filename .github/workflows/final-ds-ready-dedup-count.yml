name: Final DS-Ready Sprite Dedup and Count

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ds-ready-dedup-count.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Audit final DS-ready library
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import collections, csv, hashlib, json, re

          ROOT=Path('DS_CUSTOM_LIBRARY')
          OUT=ROOT/'DS_READY_MASTER'
          OUT.mkdir(parents=True, exist_ok=True)
          EXTS={'.png','.gif','.bmp','.jpg','.jpeg','.webp'}

          # The ER Nextdex pack is GBA source. Its converted output is scanned instead.
          EXCLUDE_SUBSTRINGS=[
              '/packs/Elite_Redux_ER_nextdex/',
              '/hack-reference-previews/',
              '/sprite-candidates/',
              '/gba-source-staging/',
          ]

          roots=[
              (ROOT/'packs','NATIVE_PACK'),
              (ROOT/'hack-packs','NATIVE_HACK'),
              (ROOT/'converted','CONVERTED_GBA'),
          ]

          def norm(s):
              s=str(s).lower().replace("'",'')
              s=s.replace('_','-').replace(' ','-')
              s=re.sub(r'[^a-z0-9-]+','-',s)
              return re.sub(r'-+','-',s).strip('-')

          def component_role(p):
              s=norm(p.stem)
              parts=[norm(x) for x in p.parts]
              joined='/'.join(parts)
              if 'icon' in s or '/icon/' in joined or '/icons/' in joined:
                  return 'icon'
              shiny=('shiny' in s or any(x in {'front-shiny','back-shiny','shiny'} for x in parts))
              back=('back' in s or any(
                  x in {'back','backs','backsprite','backsprites','back-shiny'}
                  or 'backsprite' in x or x.endswith('-backs')
                  for x in parts
              ))
              front=('front' in s or any(
                  x in {'front','fronts','frontsprite','frontsprites','front-shiny'}
                  or 'frontsprite' in x or x.endswith('-fronts')
                  for x in parts
              ))
              if back:
                  return 'back_shiny' if shiny else 'back'
              if front:
                  return 'front_shiny' if shiny else 'front'
              return 'unknown'

          def identity_key(p, role):
              stem=norm(p.stem)
              generic={'front','back','front-shiny','back-shiny','icon','icon-generated',
                       'anim-front','anim-front-gba','back-gba','front-gba'}
              if stem in generic or stem.startswith('front-') or stem.startswith('back-'):
                  parent=norm(p.parent.name)
                  # Gender subfolder: fold one level up only if parent is a generic gender label.
                  if parent in {'male','female','m','f'}:
                      parent=norm(p.parent.parent.name)+'-'+parent
                  return parent
              # Split component folders (e.g. sprites-processed/front/abomasnow.png)
              parent_norm=norm(p.parent.name)
              if (
                  parent_norm in {'front','back','front-shiny','back-shiny','icon','icons',
                                  'fronts','backs','frontsprites','backsprites'}
                  or 'frontsprite' in parent_norm or 'backsprite' in parent_norm
                  or parent_norm.endswith('-fronts') or parent_norm.endswith('-backs')
              ):
                  return stem
              x=stem
              for suffix in ['-front-shiny','-back-shiny','-front','-back','-icon','-shiny']:
                  if x.endswith(suffix):
                      x=x[:-len(suffix)]
                      break
              return x or stem

          def rgba_and_hash(path):
              try:
                  with Image.open(path) as im:
                      im.seek(0)
                      rgba=im.convert('RGBA')
                      payload=rgba.tobytes()
                      exact=hashlib.sha256(
                          rgba.width.to_bytes(4,'big')+rgba.height.to_bytes(4,'big')+payload
                      ).hexdigest()
                      # Structural signature ignores actual palette values but preserves
                      # transparent pixels and the per-pixel color partition. This catches
                      # palette-only recolors without confusing different silhouettes/designs.
                      cmap={}
                      nextid=1
                      out=bytearray()
                      out.extend(rgba.width.to_bytes(2,'big'))
                      out.extend(rgba.height.to_bytes(2,'big'))
                      for r,g,b,a in rgba.getdata():
                          if a==0:
                              out.extend((0,0)); continue
                          key=(r,g,b,a)
                          if key not in cmap:
                              cmap[key]=nextid; nextid+=1
                          out.extend(cmap[key].to_bytes(2,'big'))
                      structural=hashlib.sha256(out).hexdigest()
                      return exact,structural,rgba.width,rgba.height,len(cmap)
              except Exception:
                  return None

          def source_name(p, root):
              try:
                  rel=p.relative_to(root)
                  return rel.parts[0] if rel.parts else root.name
              except Exception:
                  return root.name

          def quality_key(a):
              source=a['source']
              path=a['path']
              # Prefer finalized converted output, then protected/native DS reference cores,
              # then other native sources.
              if a['bucket']=='CONVERTED_GBA':
                  tier=0
              elif source=='DrPrettyman_DS_64x64':
                  tier=1
              elif source=='HG_Engine_DS_Sprites':
                  tier=2
              else:
                  tier=3
              return (tier, len(path), path)

          assets=[]
          decode_fail=[]
          for root,bucket in roots:
              if not root.exists():
                  continue
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or p.suffix.lower() not in EXTS:
                      continue
                  ps='/'+p.as_posix().replace('\\','/')+'/'
                  if any(x in ps for x in EXCLUDE_SUBSTRINGS):
                      continue
                  role=component_role(p)
                  result=rgba_and_hash(p)
                  if not result:
                      decode_fail.append(p.as_posix())
                      continue
                  exact,structural,w,h,colors=result
                  assets.append({
                      'path':p.as_posix(),
                      'bucket':bucket,
                      'source':source_name(p,root),
                      'role':role,
                      'identity':identity_key(p,role),
                      'exact_hash':exact,
                      'structural_hash':structural,
                      'width':w,'height':h,'colors':colors
                  })

          # Exact duplicates are compared only within the same component role.
          by_exact=collections.defaultdict(list)
          for a in assets:
              by_exact[(a['role'],a['exact_hash'])].append(a)

          exact_rows=[]
          exact_drop=set()
          for (role,h),items in by_exact.items():
              if len(items)<2: continue
              keep=min(items,key=quality_key)
              for a in items:
                  if a['path']==keep['path']: continue
                  exact_drop.add(a['path'])
                  exact_rows.append({
                      'reason':'EXACT_DUPLICATE',
                      'role':role,
                      'identity':a['identity'],
                      'delete_path':a['path'],
                      'keep_path':keep['path'],
                      'delete_source':a['source'],
                      'keep_source':keep['source'],
                      'exact_hash':h
                  })

          # Palette-only recolors: same role + same structural pixel partition, but
          # different exact pixels. Never compare normal to shiny because role separates them.
          by_struct=collections.defaultdict(list)
          for a in assets:
              if a['path'] in exact_drop: continue
              if a['role'] not in {'front','back','icon'}: continue
              by_struct[(a['role'],a['structural_hash'])].append(a)

          recolor_rows=[]
          recolor_drop=set()
          for (role,h),items in by_struct.items():
              if len(items)<2 or len({x['exact_hash'] for x in items})<2:
                  continue
              keep=min(items,key=quality_key)
              for a in items:
                  if a['path']==keep['path']: continue
                  # A shiny asset cannot enter this group because shiny has a separate role.
                  recolor_drop.add(a['path'])
                  recolor_rows.append({
                      'reason':'PALETTE_ONLY_RECOLOR',
                      'role':role,
                      'identity':a['identity'],
                      'delete_path':a['path'],
                      'keep_path':keep['path'],
                      'delete_source':a['source'],
                      'keep_source':keep['source'],
                      'structural_hash':h
                  })

          # Front sprites define Pokemon/form design candidates.
          fronts=[a for a in assets if a['role']=='front']
          canonical_fronts=[]
          seen_visual=set()
          for a in sorted(fronts,key=quality_key):
              # Exact duplicates and palette-only recolors share one structural design.
              visual=a['structural_hash']
              if visual in seen_visual: continue
              seen_visual.add(visual)
              canonical_fronts.append(a)

          # For approval: same semantic identity with genuinely different design geometry/
          # color partition stays separate. Nothing here is auto-deleted.
          by_identity=collections.defaultdict(list)
          for a in canonical_fronts:
              by_identity[a['identity']].append(a)

          multi=[]
          for ident,items in sorted(by_identity.items()):
              sigs={x['structural_hash'] for x in items}
              if len(sigs)<2: continue
              # Custom-ish means custom source or a name that strongly signals a custom form.
              custom_signal=any(
                  token in ident for token in
                  ['mega','redux','delta','primal','apex','ex','battle-bond','nightmare']
              ) or any(x['bucket']!='NATIVE_PACK' or x['source'] not in {
                  'DrPrettyman_DS_64x64','HG_Engine_DS_Sprites','DS_Styled_Gen5_8',
                  'Gen7_DS_Backsprites','Shiny_Icons_Gen1_9'
              } for x in items)
              if not custom_signal:
                  continue
              for n,a in enumerate(sorted(items,key=quality_key),1):
                  multi.append({
                      'identity':ident,
                      'design_option':n,
                      'source':a['source'],
                      'bucket':a['bucket'],
                      'front_path':a['path'],
                      'structural_hash':a['structural_hash'],
                      'exact_hash':a['exact_hash'],
                      'action':'KEEP_FOR_APPROVAL_SHEET'
                  })

          # Master front manifest preserves every genuinely different visual design.
          master=[]
          multi_identities={x['identity'] for x in multi}
          for a in canonical_fronts:
              master.append({
                  'identity':a['identity'],
                  'source':a['source'],
                  'bucket':a['bucket'],
                  'front_path':a['path'],
                  'structural_hash':a['structural_hash'],
                  'exact_hash':a['exact_hash'],
                  'multi_design_for_approval':a['identity'] in multi_identities
              })

          def write_csv(path,rows,fields):
              with path.open('w',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields)
                  w.writeheader(); w.writerows(rows)

          write_csv(OUT/'exact_duplicates.csv', exact_rows,
                    ['reason','role','identity','delete_path','keep_path','delete_source','keep_source','exact_hash'])
          write_csv(OUT/'palette_only_recolors.csv', recolor_rows,
                    ['reason','role','identity','delete_path','keep_path','delete_source','keep_source','structural_hash'])
          write_csv(OUT/'custom_multi_design_approval_candidates.csv', multi,
                    ['identity','design_option','source','bucket','front_path','structural_hash','exact_hash','action'])
          write_csv(OUT/'ds_ready_front_design_manifest.csv', master,
                    ['identity','source','bucket','front_path','structural_hash','exact_hash','multi_design_for_approval'])

          summary={
              'scan_roots':[str(x[0]) for x in roots],
              'ds_ready_image_files_scanned':len(assets),
              'decoded_failures':len(decode_fail),
              'front_sprite_files_found':len(fronts),
              'exact_duplicate_component_files':len(exact_rows),
              'palette_only_recolor_component_files':len(recolor_rows),
              'unique_front_visual_designs_after_exact_and_recolor_dedup':len(canonical_fronts),
              'semantic_identity_count_among_unique_front_designs':len(by_identity),
              'custom_identities_with_multiple_genuinely_different_designs':len(multi_identities),
              'custom_design_options_preserved_for_approval':len(multi),
              'count_definition':'A Pokemon sprite design is one unique non-shiny FRONT visual after exact duplicates and palette-only recolors are collapsed. Genuinely different designs for the same custom identity are all retained and counted.',
              'important_policy':[
                  'Normal and shiny roles are never compared against each other.',
                  'No files are deleted by this audit.',
                  'Exact duplicates and palette-only recolors are isolated as cleanup candidates.',
                  'Different custom-mon designs are preserved for the approval sheet.'
              ]
          }
          (OUT/'ds_ready_dedup_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          if decode_fail:
              (OUT/'decode_failures.txt').write_text('\n'.join(decode_fail)+'\n')
          else:
              (OUT/'decode_failures.txt').write_text('')

          print(json.dumps(summary,indent=2))

      - name: Commit audit
        run: |
          git config user.name "Mercury DS Sprite Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER .github/workflows/final-ds-ready-dedup-count.yml
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Audit final DS-ready sprite duplicates and design count"
          git pull --rebase origin main
          git push origin main
