name: Final DS-Ready Sprite Dedup and Count

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ds-ready-dedup-count.yml'
      - 'tools/final_ds_ready_dedup_count.py'

permissions:
  contents: write

concurrency:
  group: mercury-ds-ready-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Run canonical DS-ready audit
        run: python tools/final_ds_ready_dedup_count.py
      - name: Commit canonical reports from latest main
        run: |
          git config user.name "Mercury DS Sprite Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python -m pip install --quiet pillow
          python tools/final_ds_ready_dedup_count.py
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit canonical DS-ready sprite library"
          git pull --rebase origin main
          git push origin main
