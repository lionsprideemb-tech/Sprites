name: Ingest DS-style Gen VII+ Direct Sprite Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-ds-style-gen7plus-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          python -m pip install requests beautifulsoup4 pillow

      - name: Crawl repository thread and download actual Dropbox sprite PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, re, json, hashlib, shutil
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from PIL import Image
          import io

          thread='https://www.pokecommunity.com/threads/ds-style-gen-vii-and-beyond-pok%C3%A9mon-sprite-repository-in-64x64.368703/'
          dest=Path('DS_CUSTOM_LIBRARY/packs/DS_Style_GenVII_Beyond_Direct')
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True,exist_ok=True)

          sess=requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0'})
          links=[]

          # OP carries the canonical Dropbox catalog, later pages carry additions/fixes.
          # PokéCommunity can challenge GitHub-hosted runners, so fall back to a public
          # text proxy that renders the same public page with outbound links preserved.
          for page_num in range(1,101):
              url=thread if page_num==1 else thread.rstrip('/')+f'/page-{page_num}'
              bodies=[]
              try:
                  r=sess.get(url,timeout=30)
                  if r.status_code==200:
                      bodies.append(r.text)
              except Exception:
                  pass

              # Fallback for anti-bot/challenge HTML.
              try:
                  proxy='https://r.jina.ai/http://' + url.split('://',1)[1]
                  pr=sess.get(proxy,timeout=45)
                  if pr.status_code==200:
                      bodies.append(pr.text)
              except Exception:
                  pass

              for body in bodies:
                  soup=BeautifulSoup(body,'html.parser')
                  for a in soup.find_all('a',href=True):
                      u=urljoin(url,a['href'])
                      if 'dropbox.com/' in u and ('raw=1' in u or re.search(r'\.(?:png|gif|jpg|jpeg)(?:\?|$)',u,re.I)):
                          links.append(u)

                  # Markdown/text-proxy links and plain URLs.
                  links += re.findall(r'https?://(?:www\.)?dropbox\.com/[^"\'<>\s\)\]]+',body,re.I)

          # Normalize / de-dupe URLs.
          cleaned=[]
          seen=set()
          for u in links:
              u=u.replace('&amp;','&')
              # Force raw response where possible.
              if 'dropbox.com/' in u and 'raw=1' not in u:
                  sep='&' if '?' in u else '?'
                  u=u+sep+'raw=1'
              if u not in seen:
                  seen.add(u); cleaned.append(u)

          records=[]
          sha_seen=set()
          for i,u in enumerate(cleaned):
              try:
                  rr=sess.get(u,timeout=45,allow_redirects=True)
              except Exception:
                  continue
              if rr.status_code!=200 or len(rr.content)<100:
                  continue
              try:
                  im=Image.open(io.BytesIO(rr.content))
                  w,h=im.size
                  fmt=(im.format or '').lower()
              except Exception:
                  continue
              if fmt not in {'png','gif','jpeg','jpg','bmp'}:
                  continue

              sha=hashlib.sha256(rr.content).hexdigest()
              if sha in sha_seen:
                  continue
              sha_seen.add(sha)

              # Preserve Dropbox filename if available.
              parsed=urlparse(u)
              name=Path(parsed.path).name or f'asset_{i:05d}.{fmt}'
              if '.' not in name:
                  name += '.png' if fmt=='png' else f'.{fmt}'
              safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
              out=dest/f'{i:05d}_{safe}'
              out.write_bytes(rr.content)

              records.append({
                  'path':out.as_posix(),
                  'source_url':u,
                  'width':w,
                  'height':h,
                  'format':fmt,
                  'bytes':len(rr.content),
                  'sha256':sha
              })

          Path('DS_CUSTOM_LIBRARY/ds_style_gen7plus_direct_report.json').write_text(json.dumps({
              'thread':thread,
              'dropbox_urls_discovered':len(cleaned),
              'unique_actual_images_collected':len(records),
              'files':records
          },indent=2))

          print(json.dumps({
              'dropbox_urls_discovered':len(cleaned),
              'unique_actual_images_collected':len(records)
          },indent=2))
          PY

      - name: Rebuild strict actual sprite audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,collections,hashlib,re

          exts={'.png','.gif','.bmp','.jpg','.jpeg'}
          rows=[]
          for base,bucket in [
            (Path('DS_CUSTOM_LIBRARY/packs'),'GENERIC_SOURCE_ASSET'),
            (Path('DS_CUSTOM_LIBRARY/hack-packs'),'HACK_SOURCE_ASSET')
          ]:
              if not base.exists(): continue
              for p in sorted(base.rglob('*')):
                  if p.is_file() and p.suffix.lower() in exts:
                      if 'Platinum_Redux_Embedded_Sprites/sprite-candidates/' in p.as_posix():
                          continue
                      rel=p.relative_to(base)
                      source=rel.parts[0] if rel.parts else ''
                      rows.append({
                        'source':source,'bucket':bucket,'path':p.as_posix(),
                        'sha256':hashlib.sha256(p.read_bytes()).hexdigest()
                      })

          with open('DS_CUSTOM_LIBRARY/actual_sprite_assets.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['source','bucket','path','sha256'])
              w.writeheader(); w.writerows(rows)

          source_counts=collections.Counter(x['source'] for x in rows)
          hack_counts={s:c for s,c in source_counts.items() if any(x['source']==s and x['bucket']=='HACK_SOURCE_ASSET' for x in rows)}

          aliases={
            'Pokemon Altered Platinum':['Altered_Platinum_Custom_Sprites'],
            'Pokemon Banished Platinum':['Banished_Platinum_Free_Megas'],
            'Pokemon Platinum Redux':['Platinum_Redux_Embedded_Sprites'],
            'Pokemon SoothingSilver':['SoothingSilver_Actual_Sprites']
          }
          registered=[]
          mf=Path('DS_CUSTOM_LIBRARY/hack_source_manifest.csv')
          if mf.exists():
              with mf.open(newline='') as f:
                  registered=list(csv.DictReader(f))

          status=[]
          def norm(s):
              return re.sub(r'[^a-z0-9]+','',s.lower().replace('pokemon','').replace('pokémon',''))
          for row in registered:
              proj=row['project']
              n=sum(source_counts.get(s,0) for s in aliases.get(proj,[]))
              if not n:
                  np=norm(proj)
                  n=sum(c for s,c in source_counts.items() if np in norm(s) or norm(s) in np)
              status.append({
                  'project':proj,
                  'actual_sprite_files':n,
                  'status':'SPRITES_COLLECTED' if n else 'SOURCE_ONLY_OR_BLOCKED'
              })

          summary={
              'actual_sprite_image_files_total':len(rows),
              'generic_actual_image_files':sum(1 for x in rows if x['bucket']=='GENERIC_SOURCE_ASSET'),
              'hack_actual_image_files':sum(1 for x in rows if x['bucket']=='HACK_SOURCE_ASSET'),
              'source_counts':dict(sorted(source_counts.items())),
              'hack_source_status':status,
              'excluded_from_counts':'DS_CUSTOM_LIBRARY/hack-reference-previews',
              'rule':'Only actual image asset bytes count. Links, patches, docs, screenshots/reference previews do not.'
          }
          Path('DS_CUSTOM_LIBRARY/actual_sprite_audit_summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit direct DS-style repository assets
        run: |
          git config user.name "Mercury Actual Sprite Intake Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/packs/DS_Style_GenVII_Beyond_Direct DS_CUSTOM_LIBRARY/ds_style_gen7plus_direct_report.json DS_CUSTOM_LIBRARY/actual_sprite_assets.csv DS_CUSTOM_LIBRARY/actual_sprite_audit_summary.json .github/workflows/ingest-ds-style-gen7plus-direct.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sprites: ingest direct DS-style Gen VII+ repository assets"
          git pull --rebase origin main
          git push origin main
