name: Orpheus DS64 native linework clarity QA (unapproved)
on:
  push:
    branches:
      - mercury/orpheus-resource-audit-20261109
    paths:
      - tools/orpheus_ds64_linework_polish.py
      - .github/workflows/orpheus-ds64-linework-polish.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==11.3.0
      - name: Verify and render authentic native DS64 source-indexed linework
        run: python tools/orpheus_ds64_linework_polish.py
      - name: Upload unapproved clarity draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-DS64-native-linework-clarity-UNAPPROVED
          path: report/linework_polish/
          retention-days: 30
