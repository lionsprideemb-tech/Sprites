name: Verify Leftover Sprite Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercury-leftover-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify recovery pool
        run: python tools/verify_leftover_recovery.py
      - name: Commit verification
        if: always()
        run: |
          git config user.name "Mercury Sprite Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER/leftover_recovery_verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify leftover sprite recovery"
          git pull --rebase origin main
          git push origin main
