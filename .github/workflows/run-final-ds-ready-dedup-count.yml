name: Run Final DS-Ready Dedup Count

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DS_CUSTOM_LIBRARY/.run-final-ds-ready-audit'
      - 'tools/final_ds_ready_dedup_count.py'
      - '.github/workflows/run-final-ds-ready-dedup-count.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Run final DS-ready audit
        run: python tools/final_ds_ready_dedup_count.py
      - name: Commit reports
        run: |
          git config user.name "Mercury DS Sprite Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DS_CUSTOM_LIBRARY/DS_READY_MASTER
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Audit final DS-ready sprite duplicates and design count"
          git pull --rebase origin main
          git push origin main
