name: Mercury master reviewer integrity
on:
  push:
    paths:
      - master-review.html
      - master-review-data.json
      - review/**
      - DS_CUSTOM_LIBRARY/converted/Verified_Source_DS64_Technical_2026_10_23/technical_quality_manifest.json
      - DS_CUSTOM_LIBRARY/comparison/DS64_Visual_Triage_2026_10_23/comparison_manifest.json
      - DS_CUSTOM_LIBRARY/recovered/Reborn_Plates_Legacy_PNG_Container_Repairs/recovery_manifest.json
      - .github/workflows/sprite-review-integrity.yml
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact final artwork approvals and protected prior choices
        run: node review/tests/final-user-artwork-approvals.cjs
      - run: node review/tests/master-review-integrity.cjs
      - name: Simulated iPhone quality inspector and protected JSON export
        run: node review/tests/quality-reviewer-browser-smoke.cjs
      - name: Reverify original source pixels and every technical candidate hash
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/convert_verified_source_pairs_ds64.py --check
          python3 tools/build_visual_rescue_comparisons.py --check
