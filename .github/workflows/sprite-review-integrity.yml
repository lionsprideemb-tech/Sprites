name: Mercury master reviewer integrity
on:
  push:
    paths:
      - master-review.html
      - master-review-data.json
      - review/**
      - .github/workflows/sprite-review-integrity.yml
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node review/tests/master-review-integrity.cjs
