 }).join('');

 let rows=all.filter(x=>x.decision!=='reject').map(x=>{let s=suggest(x),p=current(x,s);return{identity:x.identity,structural_hash:x.structural_hash,art_decision:x.decision,placement_decision:p.status,suggested_role:s.role,mercury_role:p.role,suggested_target:s.target,mercury_family:p.family,type1:p.t1,type2:p.t2,evolution_method:p.method,notes:p.notes,source:x.source,front_path:x.front_path}});
 let cols=Object.keys(rows[0]),csv=[cols.join(','),...rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mercury_pokedex_placement_decisions.csv';a.click()

async function init(){load();let [em,pl,legacyHtml]=await Promise.all([fetch(META,{cache:'no-store'}).then(r=>r.json()),fetch(PLAT,{cache:'no-store'}).then(r=>r.json()),fetch('legacy-gba-recovery-approval.html?v=762796d',{cache:'no-store'}).then(r=>r.text())]);all=[];for(let [k,e] of Object.entries(em.entries||{})){let h=k.split('|').pop(),d=artDecision(h);if(d!=='reject')all.push({...e,structural_hash:h,decision:d})}for(let p of(pl.entries||[])){let d=artDecision(p.structural_hash);if(d!=='reject')all.push({...p,decision:d})}let legacyDec=window.MERCURY_RECOVERED_GBA_DECISIONS||[],legacyMap=new Map(legacyDec.map(x=>[x.identity,x])),doc=new DOMParser().parseFromString(legacyHtml,'text/html');for(let card of doc.querySelectorAll('.card')){let id=card.dataset.id,d=legacyMap.get(id);if(!d||d.decision==='reject')continue;let imgs=[...card.querySelectorAll('.slot img')].map(x=>x.getAttribute('src')||''),swap=/swap shiny and regular/i.test(d.note||''),front=swap?(imgs[2]||imgs[0]):imgs[0],back=swap?(imgs[3]||imgs[1]):imgs[1];all.push({identity:id,name:card.querySelector('.name')?.textContent?.trim()||pretty(id),pitch_name:card.querySelector('.name')?.textContent?.trim()||pretty(id),family:recoveryFamily(id),source:'Legacy GBA Recovery',type1:d.type1||'',type2:d.type2||'',note:d.note||'',front_path:front||'',back_path:back||'',structural_hash:'legacy-'+id,decision:d.decision})}let seen=new Set();all=all.filter(x=>{let k=key(x);if(seen.has(k))return false;seen.add(k);return true});let roles=[...new Set(all.map(x=>suggest(x).role))].sort();roleFilter.innerHTML='<option value="all">All roles</option>'+roles.map(x=>'<option>'+esc(x)+'</option>').join('');for(let id of['search','artFilter','placementFilter','roleFilter'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);exportBtn.onclick=exportCSV;stats();render()}
